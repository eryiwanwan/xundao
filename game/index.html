<style>
  /* 首屏底色：样式表加载完成前不要闪白 */
  html, body { margin: 0; background: #0a0b0d; color: #e8e6e3; }
  #boot {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    background: #0a0b0d; color: #6f6a63;
    font: 400 13px/1.9 "Songti SC", "Noto Serif SC", serif;
    letter-spacing: .28em; transition: opacity .5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  .nojs { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; padding: 2em; text-align: center; }
</style>
</head>
<body>
  <div id="bg"></div>           <!-- 背景色层（兜底） -->
  <div id="bgimg"></div>         <!-- 背景图层（在背景色之上） -->
  <div id="chars"></div>         <!-- 立绘层（在背景图之上，文字之下） -->
  <div id="hud"></div>
  <div id="stage"></div>
  <audio id="bgm" loop preload="auto"></audio>   <!-- 背景音乐 -->
  <audio id="sfx" preload="none"></audio>       <!-- 单次音效 -->

  <div id="boot">正在落雪</div>
  <noscript>
    <div class="nojs">《驯刀》需要 JavaScript 才能阅读。<br>请在浏览器设置里开启后刷新页面。</div>
  </noscript>

  <!-- 顺序很重要：先加载彩蛋数据与剧情数据，再加载引擎 -->
  <script src="eggs.js?v=023"></script>
  <script src="story.js?v=023"></script>
  <script src="engine.js?v=023"></script>
  <script>
    /* 引擎渲染完封面后收起启动遮罩；网络慢也不卡住入口 */
    (function(){
      var b = document.getElementById('boot');
      function hide(){
        if(!b || b.classList.contains('gone')) return;
        b.classList.add('gone');
        setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 600);
      }
      if(document.readyState === 'complete') setTimeout(hide, 120);
      else window.addEventListener('load', function(){ setTimeout(hide, 120); });
      setTimeout(hide, 2500);
    })();
  </script>
</body>
